<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plumber's Path Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            background: #87CEEB;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #time-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }

        #score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }

        #status-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            text-shadow: 4px 4px 0px black;
            text-align: center;
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
        }

        button {
            font-family: inherit;
            font-size: 16px;
            padding: 10px 20px;
            margin: 0 10px;
            background: #FFD700;
            border: 3px solid #FF8C00;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 3px 3px 0px black;
        }

        button:hover {
            background: #FFA500;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px black;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="time-display">TIME: 30</div>
            <div id="score-display">SCORE: 0</div>
            <div id="status-display"></div>
            <div id="loading">LOADING...</div>
        </div>
        <div id="controls">
            <button id="demo-btn">DEMO MODE</button>
            <button id="openai-btn" style="display: none;">OPENAI MODE</button>
            <button id="reset-btn">RESET</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
