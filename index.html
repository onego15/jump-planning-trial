<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plumber's Path Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            background: #87CEEB;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #time-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }

        #score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }

        #mode-display {
            position: absolute;
            top: 60px;
            right: 20px;
            color: #FFD700;
            font-size: 16px;
            text-shadow: 2px 2px 0px black;
            display: none;
        }

        #status-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            text-shadow: 4px 4px 0px black;
            text-align: center;
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #difficulty-selector {
            display: flex;
            gap: 10px;
        }

        #game-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: inherit;
            font-size: 16px;
            padding: 10px 20px;
            margin: 0;
            background: #FFD700;
            border: 3px solid #FF8C00;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 3px 3px 0px black;
        }

        button:hover {
            background: #FFA500;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px black;
        }

        button.selected {
            background: #FF8C00;
            border-color: #FF4500;
        }

        button.difficulty-btn {
            font-size: 14px;
            padding: 8px 16px;
        }

        button:disabled {
            background: #999;
            border-color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button:disabled:hover {
            background: #999;
        }

        #generate-btn {
            background: #00FF00;
            border-color: #00AA00;
        }

        #generate-btn:hover {
            background: #00DD00;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 3px 3px 0px black;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="time-display">TIME: 30</div>
            <div id="score-display">SCORE: 0</div>
            <div id="mode-display"></div>
            <div id="status-display"></div>
            <div id="loading">LOADING...</div>
        </div>
        <div id="controls">
            <div id="difficulty-selector">
                <button id="easy-btn" class="difficulty-btn selected">EASY</button>
                <button id="hard-btn" class="difficulty-btn">HARD</button>
            </div>
            <button id="generate-btn">GENERATE COURSE</button>
            <div id="game-buttons">
                <button id="demo-btn" disabled>DEMO MODE</button>
                <button id="openai-btn" style="display: none;" disabled>OPENAI MODE</button>
                <button id="reset-btn">RESET</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
